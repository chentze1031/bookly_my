name: bookly_my
description: Bookly MY - Malaysia Business Accounting App
publish_to: none
version: 1.1.0+57

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.2

  # Local DB
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Network & Cloud
  http: ^1.2.2
  supabase_flutter: ^2.6.0
  app_links: ^6.0.0
  google_sign_in: ^6.2.1

  # Referral attribution: read Google Play install referrer (&referrer=ref%3DCODE)
  # so a friend who installs via a shared link is auto-credited to the referrer.
  # (play_install_referrer is the maintained successor to android_play_install_referrer.)
  play_install_referrer: ^0.5.0

  # UI / Charts
  fl_chart: ^0.69.0

  # Signature pad
  signature: ^5.4.1

  # Image
  image_picker: ^1.1.2

  # PDF & Print
  pdf: ^3.11.1
  qr_flutter: ^4.1.0
  file_picker: ^8.0.0

  # Share
  share_plus: ^10.0.2

  # Monetization
  purchases_flutter: ^9.0.0
  google_mobile_ads: ^5.1.0

  # In-app rating prompt (native Play Store review flow)
  in_app_review: ^2.0.9

  # Mobile scanner
  mobile_scanner: ^6.0.0

  # Local notifications (overdue receivables reminder)
  flutter_local_notifications: ^17.2.4

  # Utils
  intl: ^0.19.0

  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  home_widget: ^0.9.3

  # MyInvois digital signature (on-device): RSA-SHA256 signing + X.509/PEM
  # parsing + device-only secure key storage. Private key never leaves device.
  pointycastle: ^3.9.1
  basic_utils: ^5.7.0
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  test: ^1.25.15

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf

dependency_overrides:
  app_links: 6.3.2

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
